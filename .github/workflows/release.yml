name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - id: release
        run: |
          tag="$GITHUB_REF_NAME"
          [[ "$tag" == v* ]] || { echo "tag must start with v" >&2; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

  binaries:
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux
            arch: x86_64
          - runner: macos-15-intel
            platform: macos
            arch: x86_64
          - runner: macos-14
            platform: macos
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.metadata.outputs.tag }}
          persist-credentials: false
      - name: Configure private ecosystem access
        env:
          GH_TOKEN: ${{ secrets.ECOSYSTEM_READ_TOKEN }}
        run: test -n "$GH_TOKEN"
      - name: Configure private ecosystem URL
        env:
          GH_TOKEN: ${{ secrets.ECOSYSTEM_READ_TOKEN }}
        run: git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: .
          build-args: "oatp"
      - name: Verify binary
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          test -x .lake/build/bin/oatp
          test "$(lake exe oatp --version)" = "oatp version ${RELEASE_VERSION}"
      - name: Package binary
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
        run: |
          archive="oatp-${VERSION}-${PLATFORM}-${ARCH}.tar.gz"
          mkdir -p dist
          cp .lake/build/bin/oatp dist/oatp
          cp LICENSE README.md dist/
          tar -czf "$PWD/dist/$archive" -C dist oatp LICENSE README.md
      - uses: actions/upload-artifact@v4
        with:
          name: oatp-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/oatp-*.tar.gz
          if-no-files-found: error

  release:
    needs: [metadata, binaries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: oatp-*
          merge-multiple: true
      - name: Create checksums
        working-directory: dist
        run: sha256sum oatp-*.tar.gz > SHA256SUMS
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.metadata.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes
          fi
