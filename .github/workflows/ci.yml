name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Cache elan toolchain
        uses: actions/cache@v6
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Cache Lake dependencies
        uses: actions/cache@v6
        with:
          path: .lake
          key: lake-${{ runner.os }}-${{ hashFiles('lake-manifest.json', 'lakefile.lean', 'lean-toolchain') }}
          restore-keys: lake-${{ runner.os }}-
      - name: Configure private ecosystem access
        env:
          GH_TOKEN: ${{ secrets.ECOSYSTEM_READ_TOKEN }}
        run: test -n "$GH_TOKEN"
      - name: Configure private ecosystem URL
        env:
          GH_TOKEN: ${{ secrets.ECOSYSTEM_READ_TOKEN }}
        run: git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: .
          build-args: "OATP OATP.Properties demo proof-demo oatp tests"
      - uses: jonaprieto/precommit-lean/.github/actions/precommit@v0.1.6
        with:
          token: ${{ secrets.ECOSYSTEM_READ_TOKEN }}
          hooks: lean-axioms
      - name: Run tests
        run: lake exe tests
      - name: Render demo gallery
        run: lake exe demo > /tmp/oatp-demo.txt
      - run: test -s /tmp/oatp-demo.txt
      - name: Run proof demo
        run: lake exe proof-demo
      - name: Check CLI environment
        run: lake exe oatp doctor

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: jonaprieto/precommit-lean/.github/actions/precommit@v0.1.6
        with:
          token: ${{ secrets.ECOSYSTEM_READ_TOKEN }}
          skip: lean-axioms
      - run: git diff --check
