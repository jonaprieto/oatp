name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Cache elan toolchain
        uses: actions/cache@v6
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Cache Lake dependencies
        uses: actions/cache@v6
        with:
          path: .lake
          key: lake-${{ runner.os }}-${{ hashFiles('lake-manifest.json', 'lakefile.lean', 'lean-toolchain') }}
          restore-keys: lake-${{ runner.os }}-
      - name: Configure private ecosystem access
        env:
          GH_TOKEN: ${{ secrets.ECOSYSTEM_READ_TOKEN }}
        run: test -n "$GH_TOKEN"
      - name: Configure private ecosystem URL
        env:
          GH_TOKEN: ${{ secrets.ECOSYSTEM_READ_TOKEN }}
        run: git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: .
          build-args: "OATP OATP.Properties demo proof-demo tests"
      - name: Audit proof axioms
        run: python3 scripts/check-axioms.py
      - name: Run tests
        run: lake exe tests
      - name: Render demo gallery
        run: lake exe demo > /tmp/oatp-demo.txt
      - run: test -s /tmp/oatp-demo.txt
      - name: Run proof demo
        run: lake exe proof-demo

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Lean style (100-col / trailing-ws / tabs)
        run: python3 scripts/style-check.py
      - run: git diff --check

  docker:
    name: Docker TPTP provers
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: E prover
            dockerfile: docker/eprover/Dockerfile
            image: oatp/eprover:bookworm-2.6
            arguments: ""
          - name: Vampire
            dockerfile: docker/vampire/Dockerfile
            image: oatp/vampire:bookworm-5.0.1
            arguments: "--time_limit 5"
          - name: Metis
            dockerfile: docker/metis/Dockerfile
            image: oatp/metis:bookworm-2.4.20260305
            arguments: "--time-limit 5"
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Build ${{ matrix.name }} image
        run: docker build --file "${{ matrix.dockerfile }}" --tag "${{ matrix.image }}" .
      - name: Run no-network smoke test
        run: scripts/docker-tptp-smoke.sh "${{ matrix.image }}" ${{ matrix.arguments }}
